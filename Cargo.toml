[workspace]
members = ["crates/strata-graph-core", "crates/strata-graph"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tejaswi-kashyap-006/strata-graph"
authors = ["Tejaswi Kashyap"]
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
