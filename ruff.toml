line-length = 100
target-version = "py310"

# Fixture repos contain deliberately odd code (shadowed names, undefined
# symbols, late imports) that the edge tests depend on. Never lint or format them.
extend-exclude = ["crates/strata-graph-core/tests/fixtures", "**/*.md"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
